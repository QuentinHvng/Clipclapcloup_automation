name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.*

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $binary = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $binary.FullName bin\ffmpeg.exe
          "ffmpeg is $((Get-Item bin\ffmpeg.exe).Length / 1MB) MB"

      - name: Build
        run: pyinstaller --noconfirm clipclapcloup.spec

      - name: Check the executable exists
        shell: pwsh
        run: |
          if (-not (Test-Path dist\ClipClapCloup.exe)) { throw "the build produced no executable" }
          "built $((Get-Item dist\ClipClapCloup.exe).Length / 1MB) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipClapCloup-windows
          path: dist/ClipClapCloup.exe
          retention-days: 30

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/ClipClapCloup.exe
          generate_release_notes: true
          body: |
            Download `ClipClapCloup.exe` below and run it — nothing to install.

            Windows SmartScreen will warn about an unknown publisher the first time,
            because the app is not code-signed. Choose "More info" then "Run anyway".
