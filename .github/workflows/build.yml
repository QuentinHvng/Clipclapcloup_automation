name: Build Windows app

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller==6.*

      - name: Fetch ffmpeg
        shell: pwsh
        run: |
          $url = "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip"
          Invoke-WebRequest -Uri $url -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg-tmp
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          $binary = Get-ChildItem -Path ffmpeg-tmp -Recurse -Filter ffmpeg.exe | Select-Object -First 1
          Copy-Item $binary.FullName bin\ffmpeg.exe
          "ffmpeg is $([math]::Round((Get-Item bin\ffmpeg.exe).Length / 1MB)) MB"

      # Two shapes of the same app. The single file is the easy one to hand
      # over; the folder is the one antivirus engines leave alone, because it
      # has no self-extracting stub.
      - name: Build the single file
        env:
          CCC_ONEFILE: "1"
        run: pyinstaller --noconfirm --distpath dist-onefile --workpath build-onefile clipclapcloup.spec

      - name: Build the folder version
        env:
          CCC_ONEFILE: "0"
        run: pyinstaller --noconfirm --distpath dist-folder --workpath build-folder clipclapcloup.spec

      - name: Package and check both
        shell: pwsh
        run: |
          if (-not (Test-Path dist-onefile\ClipClapCloup.exe)) { throw "the single-file build produced no executable" }
          if (-not (Test-Path dist-folder\ClipClapCloup\ClipClapCloup.exe)) { throw "the folder build produced no executable" }
          Compress-Archive -Path dist-folder\ClipClapCloup -DestinationPath ClipClapCloup-folder.zip -Force
          "single file: $([math]::Round((Get-Item dist-onefile\ClipClapCloup.exe).Length / 1MB)) MB"
          "folder zip:  $([math]::Round((Get-Item ClipClapCloup-folder.zip).Length / 1MB)) MB"

      - uses: actions/upload-artifact@v4
        with:
          name: ClipClapCloup-windows
          path: |
            dist-onefile/ClipClapCloup.exe
            ClipClapCloup-folder.zip
          retention-days: 30

      - name: Publish a release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist-onefile/ClipClapCloup.exe
            ClipClapCloup-folder.zip
          generate_release_notes: true
          body: |
            ## Download

            **`ClipClapCloup.exe`** — one file, nothing to install. Start here.

            **`ClipClapCloup-folder.zip`** — the same app as a folder. Use this one
            if your antivirus blocks the single file: unzip it anywhere and run
            `ClipClapCloup.exe` from inside the folder, keeping the files next to it.

            ## If it closes on its own after a few seconds

            That is your antivirus, not a crash. The app is not code-signed and it
            opens a local network port so your phone can pick up clips, which some
            security suites treat as suspicious on sight. Either add an exclusion for
            it, or use the folder version above, which is flagged far less often.

            Windows also warns about an unknown publisher the first time — choose
            "More info" then "Run anyway".
